site_name: Apigee Tools
site_url: https://peterschwps.com/docs/apigee/
site_description: >-
  Diagnostics, completion, and quick fixes for Apigee X proxy and shared flow
  XML, based on Google's documentation, and a read-only dashboard of an
  organization's deployments.
site_author: Peter Schwips
repo_url: https://github.com/peterschwps/Apigee-Tools
repo_name: peterschwps/Apigee-Tools
copyright: © Peter Schwips

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Geist
    code: Geist Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    scheme: default
    primary: black
    accent: grey

extra_css:
  - css/extra.css

plugins:
  - search
  - privacy
  - social

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - User guide: index.md
  - Development: development.md
